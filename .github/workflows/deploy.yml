# GitHub Actions 部署静态站点到阿里云 OSS
# 需在仓库 Settings → Secrets and variables → Actions 中配置：
#   OSS_ACCESS_KEY_ID     - 阿里云 AccessKey ID
#   OSS_ACCESS_KEY_SECRET - 阿里云 AccessKey Secret
#   OSS_BUCKET            - OSS Bucket 名称（如 my-bucket）

name: Deploy to Alibaba Cloud OSS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: git clone --depth 1 https://github.com/${{ github.repository }}.git .
        env:
          GIT_SSL_NO_VERIFY: false

      - name: Setup Node.js and pnpm
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install ossutil and deploy
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
        run: |
          curl -o ossutil64 https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          unzip ossutil64 -d ossutil_tmp
          chmod +x ossutil_tmp/ossutil-v1.7.19-linux-amd64/ossutil64
          sudo mv ossutil_tmp/ossutil-v1.7.19-linux-amd64/ossutil64 /usr/local/bin/ossutil
          ossutil config -e oss-cn-beijing.aliyuncs.com -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"
          ossutil cp -rf out/ oss://$OSS_BUCKET/
